logging:  level:    org.hibernate.SQL: DEBUGserver:  servlet:    contextPath: /api/account  port: 8080springdoc:  apiDocs:    serverUrl: "http://localhost:8080"    enabled: true  swaggerUi:    enabled: true    path: /swagger-ui.htmlspring:  main:    banner-mode: off # cầu hình banner - hiển thị version spring boot  #  autoconfigure:  #    exclude:  #      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration  jpa:    open-in-view: false    show-sql: true  security:    user:      name: admin      password: admin123app:  account:    datasource:      postgres:        url: jdbc:postgresql://localhost:5431/db_project        schema: sch_account        driverClassName: org.postgresql.Driver        username: u_account        password: u_account        hikari:          poolName: hikari_account          connectionTimeout: 30000 # maximum number of milliseconds that a client will wait for a connection          minimumIdle: 5           # minimum number of idle connections maintained by HikariCP in a connection pool          maximumPoolSize: 10      # maximum pool size          idleTimeout: 10000       # maximum idle time for connection          maxLifetime: 1800000      # maximum lifetime in milliseconds of a connection in the pool after it is closed          autoCommit: true         # default auto-commit behavior  jwt:    client-id: project    token-validity-in-seconds: 86400 # token is valid 24 hours    token-validity-in-seconds-for-remember-me: 108000 # valid 30 hours    base64-secret:     base64-public: 