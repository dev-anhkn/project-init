server:  servlet:    contextPath: /api/demo  port: 8080springdoc:  apiDocs:    serverUrl: "http://localhost:8080"    enabled: true  swaggerUi:    enabled: true    path: /swagger-ui.htmlspring:  main:    banner-mode: off # cầu hình banner - hiển thị version spring boot  autoconfigure:    exclude:      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration